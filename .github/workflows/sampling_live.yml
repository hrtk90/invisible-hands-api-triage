name: sampling-live-acquisition

on:
  push:
    branches:
      - sampling-live-20260915
  workflow_dispatch:

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requests
        run: python -m pip install requests
      - name: Run acquisition
        run: python research/sampling_live_acquire.py | tee sampling_run_console.txt
      - name: Upload sampling run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sampling-live-20260915
          path: |
            sampling_run/
            sampling_run_console.txt
          if-no-files-found: warn
